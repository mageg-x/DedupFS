[package]
name = "dedupfs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.87"
clap = { version = "4.5.2", features = ["derive"] }
path-absolutize = "3.1.0"
serde = { version = "1.0.203", features = ["derive"] }
serde_yaml = "0.9.34"
tokio = { version = "1.48.0", features = ["full"] }
libc = "0.2.177"
bincode = "1.3.3"
fuser = { version = "0.16.0", features = ["serializable"] } 
daemonize = "0.5.0"
nix = { version = "0.30.1", features = ["process", "fs"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
thiserror = "2.0.17"
chrono = "0.4.42"
signal-hook = "0.3.17"
lazy_static = "1.5.0"
fastcdc = "3.2.1"
sha2 = "0.10.9"
serde_json = "1.0.145"
dashmap = "6.1.0"
fs2 = "0.4.3"
md5 = "0.8.0"
xattr = "1.6.1"
rocksdb = "0.24.0"
blake3 = "1.8.2"
uuid = { version = "1.8.0", features = ["v4", "fast-rng"] }
zstd = "0.13.3"
aes-gcm = "0.10.3"
rand = "0.9.2"
base64 = "0.22.1"
pbkdf2 = "0.12.1"
hmac = "0.12.1"
sha256 = "1.5.0"
hex = "0.4.3"
defer = "0.2.1"




